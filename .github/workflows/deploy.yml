# Автодеплой: при каждом push в main файлы сайта копируются на сервер по SSH.
# Настройка сервера и секретов описана в DEPLOY.md.
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» во вкладке Actions для ручного запуска

# Два деплоя одновременно не идут: новый ждёт, пока закончится предыдущий.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Upload site files
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Убираем пробелы и \r, которые прилипают при копировании секретов из Windows.
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SSH_HOST=$(trim "$SSH_HOST")
          SSH_USER=$(trim "$SSH_USER")
          SSH_PORT=$(trim "$SSH_PORT"); SSH_PORT=${SSH_PORT:-22}
          DEPLOY_PATH=$(trim "$DEPLOY_PATH")

          # Защита: rsync --delete стирает на сервере всё лишнее в папке,
          # поэтому пустой путь или корень диска не пропускаем.
          case "$DEPLOY_PATH" in
            ""|"/"|"/root"|"/home"|"/var"|"/var/www") echo "::error::DEPLOY_PATH='$DEPLOY_PATH' — так нельзя, укажите папку сайта"; exit 1 ;;
          esac

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key

          # Отпечаток сервера: из секрета SSH_KNOWN_HOSTS (надёжнее) или запрашиваем у сервера.
          if [ -n "$(trim "$SSH_KNOWN_HOSTS")" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e '/^#/d' -e '/^$/d' > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          fi

          SSH_CMD="ssh -i $HOME/.ssh/site_key -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=20"

          # Сначала проверяем подключение, чтобы при ошибке было понятно, в чём дело.
          if ! err=$($SSH_CMD "$SSH_USER@$SSH_HOST" true 2>&1); then
            fp() { ssh-keygen -lf "$1" 2>/dev/null | awk '{print $NF, $2}' | tr '\n' ' '; }
            expected=$(fp ~/.ssh/known_hosts)
            actual=$(ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null | fp -)
            echo "$err"
            echo "::error::SSH не подключился: $(printf '%s' "$err" | tr -d '\r' | tail -n 1). Ожидаемые отпечатки: ${expected:-нет, SSH_KNOWN_HOSTS пустой или испорчен}. Сервер показывает: ${actual:-сервер не ответил}"
            exit 1
          fi

          rsync -rlvz --delete --checksum \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '/*.md' \
            -e "$SSH_CMD" \
            ./ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/site_key
