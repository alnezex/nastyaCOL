# Автодеплой: при каждом push в main файлы сайта копируются на сервер по SSH.
# Настройка сервера и секретов описана в DEPLOY.md.
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» во вкладке Actions для ручного запуска

# Два деплоя одновременно не идут: новый ждёт, пока закончится предыдущий.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Upload site files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Защита: rsync --delete стирает на сервере всё лишнее в папке,
          # поэтому пустой путь или корень диска не пропускаем.
          case "$DEPLOY_PATH" in
            ""|"/"|"/root"|"/home"|"/var"|"/var/www") echo "DEPLOY_PATH='$DEPLOY_PATH' — так нельзя, укажите папку сайта"; exit 1 ;;
          esac

          rsync -rlvz --delete --checksum \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '/*.md' \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT:-22} -o BatchMode=yes" \
            ./ "$SSH_USER@$SSH_HOST:${DEPLOY_PATH%/}/"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
